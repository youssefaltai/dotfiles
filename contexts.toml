]


# --- freelance (clients) -----------------------------------------------------
# One shared identity; each client is a subdirectory of ~/work/freelance.
# Adding a client costs one directory — no new key, account, or profile.
#
# INCOMPLETE: fill in `email`, `github`, and `ssh_key`, then run `ctx sync`.
# Leave it as-is and `ctx check` will keep reporting it; nothing is generated
# for a context whose email is still "TODO".
[contexts.freelance]
kind        = "client"
# Deliberately the personal identity: freelance work is committed as
# youssefaltai. Because email/ssh_alias/gh_config all match the base context,
# `ctx sync` generates no identity file, no includeIf and no Host alias for it —
# there is nothing to override. What the context still buys is the directory
# layout, per-client subdirectories, nvim-webdev, and strict rails.
email       = "youssef.altai@icloud.com"
github      = "youssefaltai"
ssh_alias   = "github.com"
ssh_key     = "id_ed25519_personal"
signing_key = "id_ed25519_personal.pub"
gh_config   = "gh"
nvim        = "nvim-webdev"
stack       = "typescript"
strict      = true
# Per-client subdirectories. Used for billing/reporting and by `ctx which`;
# they share the identity above.
clients     = ["corae-young", "harold-b-smith"]
notes = [
  "Freelance clients share one identity; each client is a subdirectory here.",
  "Adding a client costs a directory, not a new key, account or Claude profile.",
]
