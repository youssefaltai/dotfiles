# ~/.config/tmux/tmux.conf — minimal, zero plugins. Reference: man tmux / https://github.com/tmux/tmux/wiki
# tmux 3.2+ reads this from $XDG_CONFIG_HOME automatically, so $HOME stays clean.
# Reload a running session after edits with:  prefix r   (see keybindings below)

# --- Terminal & truecolor ---------------------------------------------------
# Ghostty runs as xterm-256color and is fully truecolor. Advertise its features
# so colors, undercurls, clipboard, links and modern keys reach nvim intact:
#   RGB        24-bit color (Kanagawa palette, nvim themes)
#   usstyle    styled/curly underlines — nvim LSP-diagnostic & spell undercurls
#   clipboard  Ghostty accepts OSC 52, so yanks reach the Mac clipboard (incl. SSH)
#   hyperlinks OSC 8 links pass through (also shown in copy mode, tmux 3.5+)
#   extkeys    CSI-u extended keys — Ctrl-./Ctrl-Enter/Ctrl-Shift-… reach nvim
#   osc7       shells report cwd, so new splits inherit it reliably
#   title      inner apps can set the window title (see set-titles below)
#   sync       synchronized output — kills redraw flicker
set  -g  default-terminal "tmux-256color"
set  -s  extended-keys on   # enable CSI-u so the extkeys feature actually fires
set  -as terminal-features ",xterm-256color:RGB,usstyle,clipboard,hyperlinks,extkeys,osc7,title,sync"
# ----------------------------------------------------------------------------

# --- General behavior -------------------------------------------------------
set  -sg escape-time 10           # match zsh KEYTIMEOUT=1 — snappy Esc, no lag in nvim
set  -g  focus-events on          # let nvim see focus gain/loss (autoread, etc.)
set  -g  history-limit 50000      # generous scrollback
set  -g  mouse on                 # click panes/windows, drag borders, wheel-scroll
set  -g  base-index 1             # windows start at 1 (matches the 1-key's position)
setw -g  pane-base-index 1        # panes start at 1 too
set  -g  renumber-windows on      # close a window → others renumber to stay gapless
set  -g  set-clipboard on         # yanks reach the system clipboard via OSC 52
set  -g  set-titles on            # active window name drives Ghostty's title (needs the title feature, advertised above)
set  -g  display-time 2000        # leave messages (e.g. "tmux.conf reloaded") up long enough to read
setw -g  mode-keys vi             # vi motions in copy mode (you're vi everywhere)
set  -g  status-keys vi           # vi editing at the command prompt too
# ----------------------------------------------------------------------------

# --- Prefix: C-Space --------------------------------------------------------
# Ergonomic, no clash with your zsh Ctrl-A/Ctrl-E line edits, and echoes the
# Space leader in nvim. Double-tap (C-Space C-Space) sends a literal C-Space.
unbind C-b
set  -g prefix C-Space
bind C-Space send-prefix
# ----------------------------------------------------------------------------

# --- Keybindings ------------------------------------------------------------
# Reload this file in place.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Splits that keep the current directory, with intuitive | and - keys.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# lazygit in a floating popup (display-popup needs tmux 3.2+) — full git UI over any pane, no split,
# dismisses on quit. Opens in the current pane's directory.
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# Resource monitors in floating popups, no split. `q` quits and dismisses.
# No -d: both are cwd-independent, so they open from wherever you are.
#   m = macmon — Apple-Silicon SoC view (CPU clusters, GPU, ANE, power, temps)
#   M = bottom — per-process / per-core table
bind m display-popup -E -w 90% -h 90% "macmon"
bind M display-popup -E -w 90% -h 90% "btm"

# Seamless nav between tmux panes and nvim splits — Ctrl-h/j/k/l, no prefix.
# If the focused pane is running nvim, forward the key so nvim moves its split (and
# at an nvim edge smart-splits hands off to the adjacent tmux pane); for anything
# else, move the tmux pane. We test pane_current_command directly rather than
# smart-splits' @pane-is-vim flag: it's tmux-native (no per-keypress process scan,
# instant) and, unlike the flag, can't get stuck set after nvim exits and then
# hijack whatever runs in the pane next (e.g. Claude Code). nvim keeps
# pane_current_command = nvim during :terminal and async jobs, so in-editor nav is
# unaffected; only a blocking :! or a Ctrl-Z suspend flips it — exactly when you do
# want the keys to move panes / reach your shell.
bind -n C-h if -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{m:*vim*,#{pane_current_command}}" "send-keys C-l" "select-pane -R"
# Inside copy mode there's no nvim, so the same keys just move panes.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# C-l no longer clears the shell screen (it's a pane key now) — restore via prefix.
bind C-l send-keys C-l

# Resize panes with HJKL — repeatable, so hold-then-tap without re-pressing prefix.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Resize panes with Option-hjkl — no prefix, just hold Option and tap. Needs the
# LEFT Option key to send Alt/Meta (set macos-option-as-alt = left in Ghostty).
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# Copy mode the vim way: v to select, y to yank into the macOS clipboard.
# No pbcopy pipe — set-clipboard on + the clipboard feature emit OSC 52, which
# Ghostty turns into a real clipboard write. Works locally AND over SSH (pbcopy
# would have hit the remote host's nonexistent clipboard).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
# ----------------------------------------------------------------------------

# --- Theme: Kanagawa Wave ---------------------------------------------------
# Same palette as Ghostty + kanagawa.nvim, so tmux disappears into the setup.
# sumiInk0 #16161D  fujiWhite #DCD7BA  fujiGray #727169  crystalBlue #7E9CD8
# springGreen #98BB6C  waveBlue2 #2D4F67  sumiInk4 #2A2A37
set  -g status-style "fg=#727169,bg=#16161D"
set  -g status-justify left
set  -g status-left-length 30
set  -g status-right-length 50

# Left: session name in a crystal-blue pill.
set  -g status-left  "#[fg=#16161D,bg=#7E9CD8,bold] #S #[fg=#7E9CD8,bg=#16161D] "
# Right: quiet date + time, the time picked out in fujiWhite.
set  -g status-right "#[fg=#727169]%a %d %b #[fg=#DCD7BA]%H:%M "

# Windows: inactive muted gray, active in a spring-green pill.
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=#16161D,bg=#98BB6C,bold] #I:#W "

# Pane borders: dim by default, crystal-blue on the active pane.
set  -g pane-border-style        "fg=#2A2A37"
set  -g pane-active-border-style "fg=#7E9CD8"

# Command/message line and copy-mode selection.
set  -g message-style "fg=#DCD7BA,bg=#2D4F67"
set  -g mode-style    "fg=#16161D,bg=#7E9CD8"
# ----------------------------------------------------------------------------
